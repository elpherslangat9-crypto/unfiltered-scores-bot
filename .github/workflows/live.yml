name: V63 LIVE KPL+UCL

on:
  schedule:
    - cron: '*/15 * * * *'  # Every 15 mins = saves your 100 API requests for 9 UCL tonight
  workflow_dispatch:  # Allow manual run

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          pip install requests Pillow
          echo "Deps installed"

      - name: Restore posted state
        uses: actions/cache@v4
        with:
          path: posted_state.json
          key: posted-state-v63-${{ github.run_id }}
          restore-keys: |
            posted-state-v63-

      - name: Run V63 Bot - 2KPL+9UCL + News + LiveScore
        env:
          PAGE_ID: ${{ secrets.PAGE_ID }}
          PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
          FB_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          echo "Starting V63 - 2 KPL + 9 UCL - API $API_FOOTBALL_KEY check"
          python main.py
          echo "V63 DONE - API USED check log above"

      - name: Save posted state
        uses: actions/cache@v4
        with:
          path: posted_state.json
          key: posted-state-v63-${{ github.run_id }}
          restore-keys: |
            posted-state-v63-

      - name: Commit state backup
        run: |
          git config user.name "V63 Bot"
          git config user.email "bot@unfiltered.com"
          if [ -f posted_state.json ]; then
            git add posted_state.json || true
            git commit -m "V63 state ${{ github.run_number }} - API ${{ github.run_id }}" || true
            git push || true
          fi

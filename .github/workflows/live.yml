name: Unfiltered Live V64.9 UNRESTRICTED

on:
  schedule:
    - cron: '*/2 * * * *'  # Every 2 mins - UNRESTRICTED API
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          pip install requests Pillow
          echo "Files in repo:"
          ls -la
          echo "--- Python files ---"
          find . -name "*.py" -type f

      - name: Find and Run Bot
        env:
          PAGE_ID: ${{ secrets.PAGE_ID }}
          PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
          FB_TOKEN: ${{ secrets.FB_TOKEN }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          echo "Searching for main.py or bot file..."
          if [ -f "main.py" ]; then
            echo "✅ Found main.py - running"
            python main.py
          elif [ -f "v64_8.py" ]; then
            echo "Found v64_8.py - running"
            python v64_8.py
          elif [ -f "bot.py" ]; then
            echo "Found bot.py - running"
            python bot.py
          elif [ -f "unfiltered.py" ]; then
            echo "Found unfiltered.py - running"
            python unfiltered.py

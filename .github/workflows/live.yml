name: live
on:
  schedule:
    - cron: '*/2 * * * *' # Every 2 minutes
  workflow_dispatch:

jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install requests pillow
      - name: Find and Run Bot
        env:
          PAGE_ID: ${{ secrets.PAGE_ID }}
          PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
          FB_TOKEN: ${{ secrets.FB_TOKEN }}
        run: |
          set -x
          if [ -f main.py ]; then echo "Found main.py"; python main.py
          elif [ -f v64_8.py ]; then echo "Found v64_8.py"; python v64_8.py
          elif [ -f bot.py ]; then echo "Found bot.py"; python bot.py
          else echo "No bot file found"; exit 1; fi
      - name: Save state
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update posted_state.json"
          file_pattern: posted_state.json

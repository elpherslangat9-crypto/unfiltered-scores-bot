name: Unfiltered Scores Live Bot

on:
  schedule:
    - cron: '*/2 * * * *'   # Every 2 mins live goals
  workflow_dispatch:

jobs:
  live-bot:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests Pillow

      - name: Run Unfiltered Scores Bot
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: |
          echo "=== CHECKING SECRETS ==="
          echo "PAGE_ID is: $FB_PAGE_ID"
          echo "PAGE_ID length: ${#FB_PAGE_ID}"
          echo "TOKEN length: ${#FB_PAGE_TOKEN}"
          
          if [ ${#FB_PAGE_ID} -lt 5 ]; then
            echo "ERROR: FB_PAGE_ID is empty or 0 - Secrets not set!"
            exit 1
          fi
          
          if [ ${#FB_PAGE_TOKEN} -lt 50 ]; then
            echo "ERROR: FB_PAGE_TOKEN is empty - Secrets not set!"
            exit 1
          fi
          
          echo "=== SECRETS OK - RUNNING BOT ==="
          python bot.py

      - name: Save posted state
        if: always()
        run: |
          git config --global user.name "Unfiltered Bot"
          git config --global user.email "bot@unfiltered.com"
          git add posted_state.json || echo "No state file yet"
          git commit -m "Update posted state $(date)" || echo "No changes"
          git push || echo "Push failed or no changes"

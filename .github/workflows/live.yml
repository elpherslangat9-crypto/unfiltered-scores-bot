name: Live V51 GLOBAL FAST
on:
  schedule:
    - cron: "*/2 * * * *"
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests pillow --quiet

      - name: Run V51 GLOBAL FAST
        env:
          PAGE_ID: ${{ secrets.PAGE_ID }}
          PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
        run: python bot.py

      - name: Save state FAST
        run: |
          git config user.name "unfiltered-bot"
          git config user.email "bot@unfilteredscores.com"
          git add posted_state.json || true
          if ! git diff --cached --quiet; then
            git commit -m "V51 state $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git pull --rebase origin main || true
            git push origin main || (git pull --rebase origin main && git push origin main)
          else
            echo "No state changes"
          fi

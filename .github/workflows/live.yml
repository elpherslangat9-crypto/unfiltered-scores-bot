name: Live V51 GLOBAL FAST

on:
  schedule:
    - cron: '*/6 * * * *'
  workflow_dispatch:

concurrency:
  group: v51-live-global
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps (NO requirements.txt needed)
        run: |
          python -m pip install --upgrade pip
          pip install requests facebook-sdk python-dotenv Pillow

      - name: Run V51 GLOBAL FAST
        run: |
          timeout 240 python bot.py
        env:
          FB_TOKEN: ${{ secrets.FB_TOKEN }}
          PAGE_ID: ${{ secrets.PAGE_ID }}
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}

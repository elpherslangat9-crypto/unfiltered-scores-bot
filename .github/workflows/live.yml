name: Unfiltered Live Bot V43

on:
  schedule:
    - cron: "*/3 * * * *"
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install requests pillow

      - name: Run V43 bot
        env:
          PAGE_ID: ${{ secrets.PAGE_ID }}
          PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
        run: |
          python bot.py

      - name: Save state
        run: |
          git config user.name "bot"
          git config user.email "bot@unfiltered.com"
          git add posted_state.json || true
          git diff --staged --quiet || git commit -m "state V43 [skip ci]"
          git push || true

name: Unfiltered Scores V3 TEXT ONLY 🟢

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests --quiet

      - name: Run Bot V7 GLOBAL NO.1
        run: python -u bot.py
        env:
          PYTHONUNBUFFERED: 1
          API_KEY: ${{ secrets.API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}

      - name: Save Memory No Repeats
        if: always()
        run: |
          git config user.name "bot"
          git config user.email "bot@unfiltered.com"
          git add posted.json || true
          git diff --staged --quiet || git commit -m "🟢 save memory" || true
          git push || true

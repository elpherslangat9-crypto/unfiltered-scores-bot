name: 🟢 Unfiltered Scores - WORLDWIDE LIVE

on:
  schedule:
    - cron: '*/4 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'bot.py'
      - '.github/workflows/live.yml'

jobs:
  live-scores:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: unfiltered-live
      cancel-in-progress: false

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install deps (only requests)
        run: |
          pip install --upgrade pip
          pip install requests
          python --version

      - name: 🔄 Restore previous state
        run: |
          if [ -f posted_events.json ]; then
            echo "State exists: $(cat posted_events.json | wc -c) bytes"
          else
            echo "No state yet - creating fresh"
            echo '{"events":[],"lineups":[],"ft":[],"ht":[],"news":[],"transfers":[],"daily":[]}' > posted_events.json
          fi

      - name: ⚽ RUN V16 WORLDWIDE BOT
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: |
          echo "Starting bot at $(date -u) UTC"
          python bot.py
          echo "Bot finished at $(date -u) UTC"

      - name: 💾 Save state for next run
        if: always()
        run: |
          git config user.name "UnfilteredScores Bot"
          git config user.email "bot@unfilteredscores.com"
          git add posted_events.json || true
          if git diff --staged --quiet; then
            echo "No state changes"
          else
            git commit -m "🟢 Update state $(date -u +'%Y-%m-%d %H:%M UTC') - [skip ci]"
            git push origin HEAD:main || {
              git pull --rebase origin main
              git push origin HEAD:main
            }
          fi

      - name: 📊 Log summary
        if: always()
        run: |
          echo "=== RUN SUMMARY ==="
          echo "Time: $(date -u)"
          EAT_TIME=$(TZ=Africa/Nairobi date)
          echo "EAT: $EAT_TIME"
          echo "State size: $(wc -c < posted_events.json) bytes"
          cat posted_events.json

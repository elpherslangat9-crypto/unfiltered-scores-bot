name: Live Scores Bot
on:
  schedule:
    - cron: '*/3 * * * *' # 3 mins = never miss a goal
  workflow_dispatch:
jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Run bot
        env:
          PAGE_ID: ${{ secrets.PAGE_ID }}
          PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
        run: python bot.py
      - name: Commit state
        run: |
          git pull --rebase || true
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add posted_state.json
          git commit -m "state $(date)" || echo "no change"
          git push || echo "push failed"

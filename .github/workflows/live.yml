name: Unfiltered Scores Live 🟢 WORLD NO.1

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests --quiet

      - name: Run 24/7 Bot
        run: python bot.py
        env:
          API_KEY: ${{ secrets.API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}

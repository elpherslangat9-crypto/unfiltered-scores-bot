name: Live V51 GLOBAL FAST

on:
  schedule:
    - cron: '*/6 * * * *'  # every 6 mins, not every 2 mins!
  workflow_dispatch:

concurrency:
  group: v51-live-global
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run V51 GLOBAL FAST
        run: timeout 240 python bot.py
        env:
          FB_TOKEN: ${{ secrets.FB_TOKEN }}
          PAGE_ID: ${{ secrets.PAGE_ID }}

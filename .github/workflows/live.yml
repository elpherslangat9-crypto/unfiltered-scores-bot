name: V8 WORLD NO1 LIVE - NO KEY FIXED

on:
  schedule:
    - cron: '*/2 * * * *'
  workflow_dispatch:

concurrency:
  group: unfiltered-live
  cancel-in-progress: false

jobs:
  live-scores:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Free Libs (No Key Needed)
        run: |
          pip install --upgrade pip
          pip install requests

      - name: Check Secrets
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        run: |
          if [ -z "$FB_PAGE_ID" ]; then echo "❌ FB_PAGE_ID missing"; exit 1; fi
          echo "✅ Secrets OK"

      - name: Run V8 NO-KEY Bot
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: |
          python bot.py

      - name: Save History
        run: |
          git config user.name "Unfiltered Bot V8"
          git config user.email "bot@unfiltered.local"
          if [ ! -f posted_state.json ]; then
            echo '{"kickoff":[],"goals":[],"red":[],"ft":[]}' > posted_state.json
          fi
          git add posted_state.json || true
          if git diff --staged --quiet; then
            echo "No new events"
          else
            git commit -m "V8 LIVE $(date -u) [skip ci]"
            git push
          fi

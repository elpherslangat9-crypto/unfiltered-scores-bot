name: Unfiltered Scores V11 Ultimate
on:
  schedule:
    - cron: '*/10 * * * *' # Every 10 mins = 144/day but we skip when no live, so ~60/day
  workflow_dispatch:
jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install requests
      - run: python bot.py
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          API_URL: ${{ secrets.API_URL }}
          API_KEY: ${{ secrets.API_KEY }}
      - name: Save state
        run: |
          git config user.name "bot"
          git config user.email "bot@unfiltered.com"
          git add posted_events.json || true
          git commit -m "update state" || true
          git push || true

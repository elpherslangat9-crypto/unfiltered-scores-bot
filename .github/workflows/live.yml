name: Unfiltered Scores LIVE V22 PERMANENT
on:
  schedule:
    - cron: '*/3 * * * *'
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          pip install requests pillow feedparser beautifulsoup4
      - name: Run Bot V22 PERMANENT
        env:
          FB_TOKEN: ${{ secrets.FB_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        run: python bot.py
      - name: Save State
        run: |
          git config user.name "bot"
          git config user.email "bot@unfiltered.com"
          git add state.json || true
          git commit -m "state update" || true
          git push || true

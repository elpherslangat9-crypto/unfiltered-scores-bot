name: Unfiltered Scores V25 - FORCE REACH
on:
  schedule:
    - cron: '25,55 * * * *'  # Human times like 12:25, 12:55 not 12:00
  workflow_dispatch:

concurrency:
  group: unfiltered-live-v25-force
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: pip install requests pillow feedparser

      - name: Force Human Pattern
        run: |
          DELAY=$((RANDOM % 180 + 30))
          echo "Waiting $DELAY seconds to look human..."
          sleep $DELAY

      - name: Run Bot - FORCE SHOW
        env:
          FB_TOKEN: ${{ secrets.FB_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FORCE_PHOTO_POST: "1"  # Tell bot.py to use photo method
          FB_REACH_FIX: "1"
        run: python bot.py

      - name: Save State
        if: always()
        run: |
          git pull --rebase || true
          git config user.name "bot"
          git config user.email "bot@unfiltered.com"
          git add state.json || true
          git diff --staged --quiet || git commit -m "state update [skip ci]" || true
          git push || true

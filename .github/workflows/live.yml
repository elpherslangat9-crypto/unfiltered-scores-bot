name: Daily Football Roundup

on:
  schedule:
    # 7am EAT = 4am UTC
    - cron: '0 4 * * *'
    # 11pm EAT = 20pm UTC  
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore posted state
        uses: actions/cache/restore@v4
        with:
          path: posted_events.json
          key: posted-events-daily-${{ github.run_id }}
          restore-keys: |
            posted-events-

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Run Daily Bot
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: python bot.py

      - name: Save posted state
        uses: actions/cache/save@v4
        if: always()
        with:
          path: posted_events.json
          key: posted-events-daily-${{ github.run_id }}

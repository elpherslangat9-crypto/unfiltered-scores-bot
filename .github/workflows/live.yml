name: V54 KPL FAST LIVE + UCL + GLOBAL

on:
  schedule:
    - cron: '*/3 * * * *'  # V53: Every 3 mins - KPL fast lane
  workflow_dispatch:

jobs:
  live-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          pip install requests Pillow pytz lxml

      - name: Restore state
        uses: actions/cache@v4
        with:
          path: posted_state.json
          key: v53-kpl-state-${{ github.run_id }}
          restore-keys: |
            v53-kpl-state-

      - name: Run V53 Bot
        env:
          PAGE_ID: ${{ secrets.PAGE_ID }}
          PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
          FB_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}  # fallback for V53
        run: |
          python bot.py

      - name: Save state
        uses: actions/cache/save@v4
        if: always()
        with:
          path: posted_state.json
          key: v53-kpl-state-${{ github.run_id }}

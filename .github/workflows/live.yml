name: V17 LIVE PERFECT BOT

on:
  schedule:
    - cron: '*/3 * * * *'  # Runs every 3 minutes - FASTEST GitHub allows
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  live-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies - NO DELAY
        run: |
          pip install --upgrade pip --quiet
          pip install requests Pillow --quiet

      - name: Run V17 Bot
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_TOKEN: ${{ secrets.FB_TOKEN }}
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
          NEWS_API_KEY: ${{

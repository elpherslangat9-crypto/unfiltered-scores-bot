name: Live Football
on:
  schedule:
    - cron: "* * * * *"
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pillow
      - run: python bot.py
        env:
          PAGE_ID: ${{ secrets.PAGE_ID }}
          PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
      - name: Commit state - NO DELAY
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add posted_state.json || true
          git diff --staged --quiet || git commit -m "state"
          git push || true

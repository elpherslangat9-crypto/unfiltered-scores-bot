name: V17 FREE FAST BOT

on:
  schedule:
    - cron: '*/3 * * * *' # Runs every 5 mins - NEVER SLEEPS
  workflow_dispatch:

jobs:
  live-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests Pillow feedparser --quiet

      - name: Run V18 Bot
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_TOKEN: ${{ secrets.FB_TOKEN }}
        run: python bot.py

      - name: Save state
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add posted_state.json || true
          git commit -m "save state" || true
          git push || true

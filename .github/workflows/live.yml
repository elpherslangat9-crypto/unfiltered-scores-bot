name: Unfiltered Live V65.9.1 FIXED

on:
  schedule:
    - cron: '*/2 * * * *'
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          pip install requests Pillow
          ls -la
          find . -name "*.py" -type f

      - name: Find and Run Bot
        env:
          PAGE_ID: ${{ secrets.PAGE_ID }}
          PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
          FB_TOKEN: ${{ secrets.FB_TOKEN }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          set -x
          if [ -f main.py ]; then
            echo "Found main.py"
            python main.py
          elif [ -f v64_8.py ]; then
            echo "Found v64_8.py"
            python v64_8.py
          elif [ -f bot.py ]; then
            echo "Found bot.py"
            python bot.py
          else
            PYFILE=$(find . -maxdepth 2 -name "*.py" | head -n 1)
            echo "Trying $PYFILE"
            python "$PYFILE"
          fi

      - name: Save state
        run: |
          git config --global user.name "Unfiltered Bot"
          git config --global user.email "bot@unfiltered.ke"
          git add posted_state.json || true
          git commit -m "state update" || true
          git push || true

name: Unfiltered Live Bot V57 - Real Images Only

on:
  schedule:
    - cron: '*/3 * * * *'  # Every 3 minutes - FAST for KPL, UCL, EPL
  workflow_dispatch:        # Manual run button

jobs:
  live-scores:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests Pillow pytz
          pip install --upgrade certifi

      - name: Restore posted state
        uses: actions/cache@v4
        with:
          path: posted_state.json
          key: posted-state-v57-${{ github.run_number }}
          restore-keys: |
            posted-state-v57-
            posted-state-

      - name: Run bot - Real Images Only
        env:
          PAGE_ID: ${{ secrets.PAGE_ID }}
          PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
          FB_TOKEN: ${{ secrets.FB_TOKEN }}
        run: |
          echo "Starting V57 Real Image Bot..."
          python bot.py
          echo "Done"

      - name: Save posted state
        uses: actions/cache/save@v4
        if: always()
        with:
          path: posted_state.json
          key: posted-state-v57-${{ github.run_number }}

      - name: Upload logs if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-logs
          path: |
            *.log
            posted_state.json

name: live

on:
  schedule:
    - cron: '*/2 * * * *'  # Every 2 minutes - searches all sources
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Must have to save posted_state.json
    concurrency:
      group: live-bot
      cancel-in-progress: false

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow

      - name: Run Unfiltered Scores Bot - Search All Sources
        env:
          PAGE_ID: ${{ secrets.PAGE_ID }}
          PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
          FB_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
        run: |
          echo "Starting V-ULTIMATE search..."
          echo "Page ID: $PAGE_ID"
          python bot.py

      - name: Commit state file
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🟢 auto: update posted_state.json [skip ci]"
          file_pattern: posted_state.json
          commit_user_name: "Unfiltered Bot"
          commit_user_email: "bot@unfilteredscores.com"
          push_options: '--force'

      - name: Show logs if failed
        if: failure()
        run: |
          echo "Bot failed - checking files"
          ls -la
          cat posted_state.json || echo "no state yet"

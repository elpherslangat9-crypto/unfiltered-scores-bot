name: 🟢 Unfiltered Scores - WORLDWIDE LIVE

on:
  schedule:
    - cron: '*/4 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'bot.py'

jobs:
  live-scores:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: Restore state
        run: |
          ls -lh
          cat posted_events.json || echo "no file"
          if [! -f posted_events.json ]; then
            echo '{"events":[],"lineups":[],"ft":[],"ht":[],"news":[],"transfers":[],"daily":[]}' > posted_events.json
          fi

      - name: RUN V16 WORLDWIDE BOT
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: python bot.py

      - name: Save state
        if: always()
        run: |
          git config user.name "UnfilteredScores Bot"
          git config user.email "bot@bot.com"
          git add posted_events.json
          git commit -m "update state [skip ci]" || true
          git push || true

      - name: Log summary
        if: always()
        run: |
          echo "RUN OK"
          ls -lh posted_events.json

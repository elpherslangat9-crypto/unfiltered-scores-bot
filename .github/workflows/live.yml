name: V16 FAST BIG LEAGUES KPL

on:
  schedule:
    - cron: "*/8 * * * *" # Every 8 mins - FAST but SAFE - never miss goal, no FB jail
  workflow_dispatch:

# FIX 473 RUNS - only 1 run at a time
concurrency:
  group: "v16-big-leagues-kpl"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Run V16
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: python bot.py
      - name: Save State
        run: |
          git config --global user.name "bot"
          git config --global user.email "bot@bot.com"
          git add posted_state.json || true
          git diff --staged --quiet || git commit -m "v16 $(date -u)" || true
          git push || true
